# Edge TTS Web Interface - Nginx 生产环境配置
# **Feature: production-readiness**

# 上游服务器配置
upstream edge_tts_backend {
    # 使用 least_conn 负载均衡策略
    least_conn;
    
    # 后端服务器（可配置多个实现负载均衡）
    server app:5000 weight=1 max_fails=3 fail_timeout=30s;
    # server app2:5000 weight=1 max_fails=3 fail_timeout=30s;
    
    # 保持连接
    keepalive 32;
}

# 限流配置
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tts_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# HTTP 服务器（重定向到 HTTPS）
server {
    listen 80;
    server_name _;
    
    # 健康检查端点（不重定向）
    location /health {
        proxy_pass http://edge_tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务器
server {
    listen 443 ssl http2;
    server_name _;
    
    # SSL 证书配置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 连接限制
    limit_conn conn_limit 20;
    
    # 客户端配置
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    # 代理超时配置
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # 代理缓冲配置
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;
    
    # 日志配置
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
    
    # 健康检查端点（无限流）
    location /health {
        proxy_pass http://edge_tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    
    # Prometheus 指标端点（限制访问）
    location /metrics {
        # 可选：限制只允许内网访问
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
        
        proxy_pass http://edge_tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
    
    # TTS API（较严格的限流）
    location ~ ^/(tts|mcu/tts) {
        limit_req zone=tts_limit burst=10 nodelay;
        
        proxy_pass http://edge_tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # TTS 可能需要更长的超时
        proxy_read_timeout 180s;
    }
    
    # 语音对话 API
    location ~ ^/(mcu/voice_chat|wechat/) {
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://edge_tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 语音处理需要更长超时
        proxy_read_timeout 180s;
        client_max_body_size 100M;
    }
    
    # 静态文件
    location /static {
        alias /app/static;
        expires 7d;
        add_header Cache-Control "public, immutable";
        
        # Gzip 压缩
        gzip on;
        gzip_types text/css application/javascript application/json;
        gzip_min_length 1000;
    }
    
    # 其他 API 请求
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        
        proxy_pass http://edge_tts_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    
    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
